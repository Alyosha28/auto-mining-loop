name: benchmark-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # NOTE: checkout the whole repository; benchmark/ alone is not runnable.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r auto_research/benchmark/requirements.txt
      - name: Run CI
        working-directory: auto_research/benchmark
        run: bash ci.sh
